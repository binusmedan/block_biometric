<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voxel Architect v4.1 - Sync Update</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        #input_video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 1; }
        #three_canvas { position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none; }
        #biometric_canvas { position: absolute; width: 100vw; height: 100vh; z-index: 10; transform: scaleX(-1); pointer-events: none; }
        #ui { 
            position: absolute; top: 20px; left: 20px; z-index: 100;
            color: #00f0ff; font-weight: bold; font-size: 14px;
            text-shadow: 0 0 10px #00f0ff; border-left: 3px solid #00f0ff; padding-left: 15px;
            background: rgba(0,0,0,0.6); padding: 15px;
        }
        .stat-val { color: #fff; }

        .btn {
            font-family: inherit; font-weight: bold; font-size: 12px; letter-spacing: 1px;
            color: #00f0ff; background: rgba(0, 240, 255, 0.08); border: 1px solid #00f0ff;
            padding: 8px 14px; cursor: pointer; text-shadow: inherit; text-decoration: none;
        }
        .btn:hover, .btn:focus-visible { background: rgba(0, 240, 255, 0.25); outline: none; }
        #capture_btn { margin-top: 10px; }

        /* Kilatan kamera */
        #flash { position: absolute; inset: 0; z-index: 150; background: #fff; opacity: 0; pointer-events: none; }
        #flash.on { animation: flash 0.6s ease-out; }
        @keyframes flash { from { opacity: 0.9; } to { opacity: 0; } }

        /* Hitung mundur */
        #countdown {
            position: absolute; inset: 0; z-index: 140; display: none;
            align-items: center; justify-content: center; pointer-events: none;
            color: #fff; font-size: 180px; font-weight: bold; text-shadow: 0 0 30px #00f0ff;
        }

        /* Modal hasil foto + QR */
        #photo_modal {
            position: absolute; inset: 0; z-index: 200; display: none;
            align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        #photo_modal.open { display: flex; }
        .modal-card {
            display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center;
            max-width: 92vw; padding: 24px; color: #00f0ff; text-shadow: 0 0 10px #00f0ff;
            background: rgba(0, 10, 16, 0.9); border: 1px solid #00f0ff; box-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
        }
        #photo_preview { max-width: min(56vw, 720px); max-height: 70vh; border: 1px solid rgba(0, 240, 255, 0.5); }
        .qr-side { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 260px; text-align: center; font-weight: bold; }
        #qr_box {
            width: 240px; height: 240px; background: #fff; display: flex; text-shadow: none;
            align-items: center; justify-content: center; color: #001122; font-size: 12px; padding: 8px; box-sizing: border-box;
        }
        #qr_box img { width: 100%; height: 100%; image-rendering: pixelated; }
        #upload_status { font-size: 13px; min-height: 32px; }
        #modal_timer { font-size: 10px; color: #8ff8ff; }
        .modal-actions { display: flex; gap: 8px; }
    </style>
</head>
<body>
    <div id="ui">
        <div>BIO_SYNC: ARCHITECT_OS_v4.1</div>
        <div>STATE: <span id="mode" class="stat-val">INITIALIZING</span></div>
        <div>VOXELS: <span id="count" class="stat-val">0</span></div>
        <div style="font-size: 10px; margin-top: 5px; color: #ff3333;">2 FISTS: HOLD TO RESET | 2 PALMS: HOLD TO ROTATE</div>
        <div style="font-size: 10px; margin-top: 3px; color: #8ff8ff;">PEACE SIGN (&#9996;): HOLD TO CAPTURE | [S] CAPTURE</div>
        <button id="capture_btn" class="btn" type="button">[ CAPTURE ]</button>
    </div>

    <video id="input_video" autoplay playsinline></video>
    <canvas id="three_canvas"></canvas>
    <canvas id="biometric_canvas"></canvas>
    <div id="countdown" aria-live="assertive"></div>
    <div id="flash"></div>

    <div id="photo_modal" role="dialog" aria-modal="true" aria-labelledby="modal_title">
        <div class="modal-card">
            <img id="photo_preview" alt="Captured voxel architect photo">
            <div class="qr-side">
                <div id="modal_title">BIO_CAPTURE: COMPLETE</div>
                <div id="qr_box">GENERATING...</div>
                <div id="upload_status" aria-live="polite">UPLOADING...</div>
                <div class="modal-actions">
                    <a id="save_local" class="btn" download>SAVE LOCAL</a>
                    <button id="close_modal" class="btn" type="button">CLOSE [ESC]</button>
                </div>
                <div id="modal_timer"></div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="binus-logo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const videoElement = document.getElementById('input_video');
        const bioCanvas = document.getElementById('biometric_canvas');
        const bioCtx = bioCanvas.getContext('2d');
        const modeEl = document.getElementById('mode');
        const countEl = document.getElementById('count');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three_canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const voxelGroup = new THREE.Group();
        scene.add(voxelGroup);
        const currentSketch = new THREE.Group();
        voxelGroup.add(currentSketch);

        const gridSize = 1.2; 
        const placedVoxels = new Map();
        
        const crosshair = new THREE.Mesh(
            new THREE.BoxGeometry(gridSize, gridSize, gridSize),
            new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.5 })
        );
        scene.add(crosshair);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0x00f0ff, 1.0);
        sun.position.set(5, 5, 5);
        scene.add(sun);
        camera.position.z = 20;

        let smoothedLandmarks = { Left: [], Right: [] };

        function drawHUDCircle(ctx, x, y, progress, color) {
            ctx.beginPath();
            ctx.arc(x, y, 35, -Math.PI/2, (-Math.PI/2) + (Math.PI * 2 * progress));
            ctx.lineWidth = 5; ctx.strokeStyle = color; ctx.stroke();
            ctx.setLineDash([3, 5]);
            ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2); ctx.lineWidth = 1; ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawCyberHand(ctx, landmarks, label) {
            if (!smoothedLandmarks[label] || smoothedLandmarks[label].length === 0) {
                smoothedLandmarks[label] = landmarks.map(p => ({...p}));
            } else {
                landmarks.forEach((p, i) => {
                    smoothedLandmarks[label][i].x += (p.x - smoothedLandmarks[label][i].x) * 0.45;
                    smoothedLandmarks[label][i].y += (p.y - smoothedLandmarks[label][i].y) * 0.45;
                    smoothedLandmarks[label][i].z += (p.z - smoothedLandmarks[label][i].z) * 0.1; 
                });
            }
            const pts = smoothedLandmarks[label];
            ctx.shadowBlur = 10; ctx.shadowColor = "#00f0ff";
            ctx.beginPath(); ctx.strokeStyle = "rgba(0, 240, 255, 0.6)"; ctx.lineWidth = 2;
            const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[9,10],[10,11],[11,12],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17],[0,5]];
            CONNECTIONS.forEach(([a, b]) => {
                ctx.moveTo(pts[a].x * bioCanvas.width, pts[a].y * bioCanvas.height);
                ctx.lineTo(pts[b].x * bioCanvas.width, pts[b].y * bioCanvas.height);
            });
            ctx.stroke();
            pts.forEach((pt, i) => {
                const x = pt.x * bioCanvas.width, y = pt.y * bioCanvas.height;
                if ([4, 8, 12, 16, 20].includes(i)) {
                    ctx.strokeStyle = "#00f0ff"; ctx.strokeRect(x - 6, y - 6, 12, 12);
                } else { ctx.fillStyle = "#fff"; ctx.fillRect(x - 2, y - 2, 4, 4); }
            });
        }

        let isGrabbing = false, grabTimer = 0;
        let grabOffset = new THREE.Vector3();
        
        let isBuilding = false, buildTimer = 0;
        let isErasing = false, eraseTimer = 0;
        let resetTimer = 0, rotateTimer = 0; 

        let startPinchPos = null, activeAxis = null;
        let sketchKeys = new Set();
        
        const GRAB_HOLD = 500;      
        const INTENT_HOLD = 500;    
        const RESET_HOLD = 1000;    
        const ROTATE_HOLD = 1000;   

        const pinchThreshold = 0.05; 

        function getDist(p1, p2) { return Math.sqrt(Math.pow(p1.x-p2.x,2)+Math.pow(p1.y-p2.y,2)+(p1.z&&p2.z?Math.pow(p1.z-p2.z,2):0)); }

        let lastResultTime = 0;

        function onResults(results) {
            const nowT = performance.now();
            const dtMs = Math.min(100, nowT - (lastResultTime || nowT));
            lastResultTime = nowT;

            bioCtx.clearRect(0, 0, bioCanvas.width, bioCanvas.height);
            crosshair.visible = false;
            
            if (!results.multiHandLandmarks) {
                captureHold = 0;
                isGrabbing = false; isBuilding = false; isErasing = false;
                grabTimer = 0; buildTimer = 0; eraseTimer = 0;
                resetTimer = 0; rotateTimer = 0;
                return;
            }

            let lHand = null, rHand = null;
            let handsDetected = results.multiHandedness.length;

            results.multiHandedness.forEach((hand, idx) => {
                const landmarks = results.multiHandLandmarks[idx];
                drawCyberHand(bioCtx, landmarks, hand.label);
                if(hand.label === 'Left') lHand = smoothedLandmarks['Left'];
                if(hand.label === 'Right') rHand = smoothedLandmarks['Right'];
            });

            // Peace sign (telunjuk + tengah naik, manis + kelingking turun): tahan untuk foto.
            // Gesture ini tidak bentrok dengan grab / build / erase / reset / rotate.
            const isPeace = h => h && h[8].y < h[6].y && h[12].y < h[10].y && h[16].y > h[14].y && h[20].y > h[18].y;
            const peaceHand = isPeace(rHand) ? rHand : (isPeace(lHand) ? lHand : null);
            if (peaceHand && canCapture() && !isBuilding && !isErasing && !isGrabbing) {
                captureHold += dtMs;
                drawHUDCircle(bioCtx, peaceHand[9].x * bioCanvas.width, peaceHand[9].y * bioCanvas.height, Math.min(1, captureHold / CAPTURE_HOLD), "#ffffff");
                modeEl.innerText = "SYSTEM: HOLD TO CAPTURE...";
                if (captureHold >= CAPTURE_HOLD) { captureHold = 0; startCountdown(); }
                return;
            } else {
                captureHold = 0;
            }

            if (lHand && rHand) {
                const lFist = lHand[8].y > lHand[6].y && lHand[12].y > lHand[10].y && lHand[16].y > lHand[14].y;
                const rFist = rHand[8].y > rHand[6].y && rHand[12].y > rHand[10].y && rHand[16].y > rHand[14].y;
                const lPalm = lHand[8].y < lHand[6].y && lHand[12].y < lHand[10].y && lHand[20].y < lHand[18].y;
                const rPalm = rHand[8].y < rHand[6].y && rHand[12].y < rHand[10].y && rHand[20].y < rHand[18].y;

                if (lFist && rFist) {
                    rotateTimer = 0; 
                    if (resetTimer < RESET_HOLD) {
                        resetTimer += 16;
                        drawHUDCircle(bioCtx, bioCanvas.width / 2, bioCanvas.height / 2, resetTimer/RESET_HOLD, "#ff0055");
                        modeEl.innerText = "SYSTEM: HOLD TO RESET...";
                    } else {
                        voxelGroup.position.set(0, 0, 0);
                        voxelGroup.rotation.set(0, 0, 0);
                        modeEl.innerText = "SYSTEM: HARD_RESET COMPLETE";
                    }
                    return; 
                } else {
                    resetTimer = 0; 
                }

                if (lPalm && rPalm) {
                    if (rotateTimer < ROTATE_HOLD) {
                        rotateTimer += 16;
                        drawHUDCircle(bioCtx, bioCanvas.width / 2, bioCanvas.height / 2, rotateTimer/ROTATE_HOLD, "#00f0ff");
                        modeEl.innerText = "SYSTEM: HOLD TO ENABLE ROTATION...";
                    } else {
                        modeEl.innerText = "SYSTEM: GLOBAL_ROTATE ACTIVE";
                        voxelGroup.rotation.y += (rHand[9].x - lHand[9].x - 0.5) * 0.05;
                        voxelGroup.rotation.x += (rHand[9].y - lHand[9].y) * 0.05;
                    }
                    return; 
                } else {
                    rotateTimer = 0; 
                }
            } else {
                resetTimer = 0;
                rotateTimer = 0;
            }

            let lPinching = false;
            if (lHand) {
                const isFist = lHand[8].y > lHand[6].y && lHand[12].y > lHand[10].y && lHand[16].y > lHand[14].y;
                const isPalm = lHand[8].y < lHand[6].y && lHand[12].y < lHand[10].y;
                lPinching = getDist(lHand[4], lHand[8]) < pinchThreshold;
                const handWorldPos = new THREE.Vector3((0.5 - lHand[9].x) * 25, (0.5 - lHand[9].y) * 18, 0);

                if (isFist) {
                    if (grabTimer < GRAB_HOLD) {
                        grabTimer += 16;
                        drawHUDCircle(bioCtx, lHand[0].x * bioCanvas.width, lHand[0].y * bioCanvas.height, grabTimer/GRAB_HOLD, "#ffbb00");
                    } else {
                        if (!isGrabbing) { grabOffset.copy(voxelGroup.position).sub(handWorldPos); isGrabbing = true; }
                        voxelGroup.position.copy(handWorldPos).add(grabOffset);
                        modeEl.innerText = "BIO_LINK: GRABBED";
                    }
                } else { isGrabbing = false; grabTimer = 0; if(isPalm) modeEl.innerText = "BIO_LINK: SCANNING"; }
            }

            if (rHand) {
                const thumbTip = rHand[4], indexTip = rHand[8], midTip = rHand[12];
                const pinchingNow = getDist(thumbTip, indexTip) < pinchThreshold;
                const pointingNow = indexTip.y < rHand[6].y && midTip.y > rHand[10].y;
                const palmOpen = rHand[8].y < rHand[6].y && rHand[12].y < rHand[10].y && rHand[20].y < rHand[18].y;

                const px = indexTip.x * bioCanvas.width, py = indexTip.y * bioCanvas.height;
                const worldPos = new THREE.Vector3((0.5 - indexTip.x) * 25, (0.5 - indexTip.y) * 18, -indexTip.z * 25);
                const localPos = voxelGroup.worldToLocal(worldPos.clone());
                const gx = Math.round(localPos.x / gridSize) * gridSize, gy = Math.round(localPos.y / gridSize) * gridSize, gz = Math.round(localPos.z / gridSize) * gridSize;

                if (lPinching && pointingNow && !palmOpen) {
                    buildTimer = 0;
                    if (eraseTimer < INTENT_HOLD) {
                        eraseTimer += 16;
                        drawHUDCircle(bioCtx, px, py, eraseTimer/INTENT_HOLD, "#ff3333");
                        modeEl.innerText = "INTENT: ERASER_LOCKING...";
                    } else {
                        isErasing = true;
                        const key = `${gx.toFixed(1)},${gy.toFixed(1)},${gz.toFixed(1)}`;
                        if (placedVoxels.has(key)) {
                            voxelGroup.remove(placedVoxels.get(key));
                            placedVoxels.delete(key);
                            countEl.innerText = placedVoxels.size;
                        }
                        modeEl.innerText = "INTENT: ERASER_ACTIVE";
                    }
                } 
                else if (pinchingNow && !isGrabbing && !palmOpen) {
                    eraseTimer = 0;
                    if (buildTimer < INTENT_HOLD) {
                        buildTimer += 16;
                        drawHUDCircle(bioCtx, px, py, buildTimer/INTENT_HOLD, "#00ffcc");
                        modeEl.innerText = "INTENT: BUILD_SYNCING...";
                    } else {
                        if (!isBuilding) { startPinchPos = { x: gx, y: gy, z: gz }; sketchKeys.clear(); isBuilding = true; activeAxis = null; }
                        else {
                            const dx = Math.abs(gx - startPinchPos.x), dy = Math.abs(gy - startPinchPos.y), dz = Math.abs(gz - startPinchPos.z);
                            if (!activeAxis && (dx > 0.4 || dy > 0.4 || dz > 0.4)) {
                                if (dx >= dy && dx >= dz) activeAxis = 'x';
                                else if (dy >= dx && dy >= dz) activeAxis = 'y';
                                else activeAxis = 'z';
                            }
                            let tx = startPinchPos.x, ty = startPinchPos.y, tz = startPinchPos.z;
                            if (activeAxis === 'x') tx = gx; else if (activeAxis === 'y') ty = gy; else if (activeAxis === 'z') tz = gz;
                            addSketchVoxel(tx, ty, tz);
                        }
                        modeEl.innerText = "INTENT: BUILDING";
                    }
                } 
                else {
                    if (palmOpen) {
                        if (isBuilding) commitVoxels();
                        isBuilding = false; isErasing = false;
                        buildTimer = 0; eraseTimer = 0;
                        modeEl.innerText = "BIO_LINK: NAVIGATING";
                    }
                }

                if (isBuilding || buildTimer > 0 || isErasing || eraseTimer > 0) {
                    crosshair.visible = true;
                    crosshair.position.copy(voxelGroup.localToWorld(new THREE.Vector3(gx, gy, gz)));
                    crosshair.material.color.set((isErasing || eraseTimer > 0) ? 0xff3333 : 0x00f0ff);
                }
            }
        }

        function addSketchVoxel(x, y, z) {
            const key = `${x.toFixed(1)},${y.toFixed(1)},${z.toFixed(1)}`;
            if (sketchKeys.has(key) || placedVoxels.has(key)) return;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(gridSize*0.98, gridSize*0.98, gridSize*0.98), new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true }));
            mesh.position.set(x, y, z);
            currentSketch.add(mesh);
            sketchKeys.add(key);
        }

        function commitVoxels() {
            while(currentSketch.children.length > 0) {
                const f = currentSketch.children[0];
                const key = `${f.position.x.toFixed(1)},${f.position.y.toFixed(1)},${f.position.z.toFixed(1)}`;
                const cube = createFinalCube(f.position.x, f.position.y, f.position.z);
                voxelGroup.add(cube);
                placedVoxels.set(key, cube);
                currentSketch.remove(f);
            }
            countEl.innerText = placedVoxels.size;
        }

        function createFinalCube(x, y, z) {
            const g = new THREE.BoxGeometry(gridSize*0.95, gridSize*0.95, gridSize*0.95);
            const m = new THREE.MeshPhongMaterial({ color: 0x001122, emissive: 0x00f0ff, emissiveIntensity: 0.4, transparent: true, opacity: 0.8 });
            const mesh = new THREE.Mesh(g, m);
            mesh.position.set(x, y, z);
            mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: 0x00f0ff })));
            return mesh;
        }

        // ================== CAPTURE + UPLOAD + QR ==================
        const CAPTURE_HOLD = 1500;      // ms tahan peace sign
        const COUNTDOWN = 3;            // detik
        const MODAL_TIMEOUT = 60;       // detik
        const JPEG_QUALITY = 0.9;

        const APP = Object.assign({ SUPABASE_URL: '', SUPABASE_ANON_KEY: '', BUCKET: 'fog-glass', FOLDER: 'photos', VIEWER_URL: '' }, window.BIO_SYNC_CONFIG || {});
        const supa = (APP.SUPABASE_URL && APP.SUPABASE_ANON_KEY && window.supabase)
            ? window.supabase.createClient(APP.SUPABASE_URL, APP.SUPABASE_ANON_KEY, { auth: { persistSession: false } })
            : null;

        const countdownEl = document.getElementById('countdown');
        const flashEl = document.getElementById('flash');
        const modalEl = document.getElementById('photo_modal');
        const previewEl = document.getElementById('photo_preview');
        const qrBox = document.getElementById('qr_box');
        const uploadStatusEl = document.getElementById('upload_status');
        const saveLocalEl = document.getElementById('save_local');
        const modalTimerEl = document.getElementById('modal_timer');
        const closeBtn = document.getElementById('close_modal');
        const exportCanvas = document.createElement('canvas');
        const exportCtx = exportCanvas.getContext('2d');

        let captureState = 'idle';      // idle | countdown | modal
        let captureHold = 0;
        let countdownTimer = null, modalTimer = null, photoUrl = null;

        const canCapture = () => captureState === 'idle' && !!videoElement.videoWidth;
        const pad2 = n => String(n).padStart(2, '0');

        function randomId() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            const b = crypto.getRandomValues(new Uint8Array(16));
            return Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
        }

        function startCountdown() {
            captureState = 'countdown';
            let n = COUNTDOWN;
            countdownEl.style.display = 'flex';
            countdownEl.textContent = n;
            countdownTimer = setInterval(() => {
                n--;
                if (n > 0) { countdownEl.textContent = n; return; }
                clearInterval(countdownTimer);
                countdownEl.style.display = 'none';
                countdownEl.textContent = '';
                takePhoto();
            }, 1000);
        }

        // Gabungkan 3 layer persis seperti di layar: video (cover + mirror), voxel three.js, overlay tangan (mirror)
        function composite() {
            const W = window.innerWidth, H = window.innerHeight;
            exportCanvas.width = W; exportCanvas.height = H;
            const e = exportCtx;
            e.fillStyle = '#000'; e.fillRect(0, 0, W, H);

            // 1. Video: object-fit cover + scaleX(-1)
            const vw = videoElement.videoWidth, vh = videoElement.videoHeight;
            const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s;
            e.save();
            e.translate(W, 0); e.scale(-1, 1);
            e.drawImage(videoElement, (W - dw) / 2, (H - dh) / 2, dw, dh);
            e.restore();

            // 2. Three.js: render ulang lalu langsung salin (tanpa preserveDrawingBuffer)
            renderer.render(scene, camera);
            e.drawImage(renderer.domElement, 0, 0, W, H);

            // 3. Overlay biometrik: di-stretch 100vw x 100vh + scaleX(-1)
            e.save();
            e.translate(W, 0); e.scale(-1, 1);
            e.drawImage(bioCanvas, 0, 0, W, H);
            e.restore();

            // 4. Watermark logo "BINUS @Medan Mantap Kaleee" di pojok kanan bawah (sama seperti video Accessory Filter)
            let m = Math.min(W, H) * 0.03, lh = 0;
            if (window.BinusLogo) ({ m, lh } = window.BinusLogo.drawWatermark(e, W, H, 0.4, 0.03));

            // Caption tepat di atas logo
            const d = new Date();
            const caption = ``;
            e.font = `bold ${Math.round(H * 0.022)}px "Courier New", monospace`;
            e.textAlign = 'right'; e.textBaseline = 'bottom';
            e.shadowBlur = 10; e.shadowColor = '#00f0ff';
            e.fillStyle = '#00f0ff';
            e.fillText(caption, W - m, H - m - lh);
            e.shadowBlur = 0;
            return d;
        }

        function takePhoto() {
            captureState = 'modal';
            const d = composite();
            flashEl.classList.remove('on'); void flashEl.offsetWidth; flashEl.classList.add('on');

            exportCanvas.toBlob(blob => {
                const fileName = `bio-sync-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}.jpg`;
                showModal(blob, fileName);
                if (!blob) { qrBox.textContent = 'CAPTURE FAILED'; uploadStatusEl.textContent = ''; return; }
                uploadPhoto(blob, d);
            }, 'image/jpeg', JPEG_QUALITY);
        }

        function showModal(blob, fileName) {
            if (photoUrl) URL.revokeObjectURL(photoUrl);
            photoUrl = blob ? URL.createObjectURL(blob) : null;
            previewEl.src = photoUrl || '';
            saveLocalEl.href = photoUrl || '#';
            saveLocalEl.download = fileName;
            qrBox.textContent = 'GENERATING...';
            uploadStatusEl.textContent = 'UPLOADING...';
            modalEl.classList.add('open');
            closeBtn.focus();

            let left = MODAL_TIMEOUT;
            modalTimerEl.textContent = `AUTO-CLOSE IN ${left}s`;
            clearInterval(modalTimer);
            modalTimer = setInterval(() => {
                left--;
                modalTimerEl.textContent = `AUTO-CLOSE IN ${left}s`;
                if (left <= 0) closeModal();
            }, 1000);
        }

        function closeModal() {
            clearInterval(modalTimer);
            modalEl.classList.remove('open');
            captureState = 'idle';
            captureHold = 0;
        }

        // VIEWER_URL dari config.js, atau photo.html di folder yang sama dengan halaman ini
        function viewerBase() { return APP.VIEWER_URL || new URL('photo.html', location.href).href; }
        function isLocalViewer(u) { return u.protocol === 'file:' || ['localhost', '127.0.0.1', '[::1]', '::1'].includes(u.hostname); }

        async function uploadPhoto(blob, d) {
            if (!supa) {
                qrBox.textContent = 'SUPABASE NOT CONFIGURED';
                uploadStatusEl.textContent = 'Isi config.js untuk QR. Gunakan SAVE LOCAL.';
                return;
            }
            const day = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
            const path = `${APP.FOLDER}/${day}/${randomId()}.jpg`;
            try {
                const { error } = await supa.storage.from(APP.BUCKET).upload(path, blob, {
                    contentType: 'image/jpeg', cacheControl: '3600', upsert: false
                });
                if (error) throw error;
                if (captureState !== 'modal') return;   // modal sudah ditutup
                // QR ke photo.html; photo.html yang mengambil foto dari Supabase Storage via ?p=<path>
                const viewer = new URL(viewerBase());
                viewer.searchParams.set('p', path);
                renderQR(viewer.href);
                console.info('Viewer:', viewer.href);
                uploadStatusEl.textContent = isLocalViewer(viewer)
                    ? 'WARNING: photo.html masih di localhost/file, HP tidak bisa membukanya. Isi VIEWER_URL di config.js.'
                    : 'SCAN TO SAVE / SHARE';
            } catch (err) {
                console.error('Upload failed:', err);
                qrBox.textContent = 'UPLOAD FAILED';
                uploadStatusEl.textContent = `ERROR: ${err.message || err}`;
            }
        }

        function renderQR(url) {
            const qr = qrcode(0, 'M');
            qr.addData(url);
            qr.make();
            const img = new Image();
            img.src = qr.createDataURL(8, 2);
            img.alt = 'QR code to save or share the photo';
            qrBox.replaceChildren(img);
        }

        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (k === 'escape') { if (captureState === 'modal') closeModal(); return; }
            if (k === 's' && canCapture()) startCountdown();
        });
        document.getElementById('capture_btn').addEventListener('click', e => {
            e.currentTarget.blur();
            if (canCapture()) startCountdown();
        });
        closeBtn.addEventListener('click', closeModal);

        const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
        hands.onResults(onResults);
        new Camera(videoElement, { onFrame: async () => {
            // Resize hanya bila berubah: set width tiap frame mengosongkan canvas (overlay bisa hilang saat capture)
            if (bioCanvas.width !== videoElement.videoWidth || bioCanvas.height !== videoElement.videoHeight) { bioCanvas.width = videoElement.videoWidth; bioCanvas.height = videoElement.videoHeight; }
            await hands.send({image: videoElement});
        }, width: 1280, height: 720 }).start();
        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        animate();
    </script>
</body>
</html>
