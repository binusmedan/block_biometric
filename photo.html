<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Voxel Architect - Your Photo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: #000a10; color: #00f0ff;
            font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center;
            padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
            background-image: radial-gradient(ellipse at top, rgba(0, 240, 255, 0.14), transparent 60%);
        }
        h1 { font-size: 15px; letter-spacing: 2px; margin: 4px 0 16px; text-align: center; text-shadow: 0 0 10px #00f0ff; }
        .frame {
            width: 100%; max-width: 720px; border: 1px solid #00f0ff; border-left-width: 3px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25); background: #000; min-height: 120px;
            display: flex; align-items: center; justify-content: center;
        }
        .frame img { width: 100%; height: auto; display: block; -webkit-touch-callout: default; }
        .actions { display: flex; gap: 10px; width: 100%; max-width: 720px; margin-top: 16px; }
        .btn {
            flex: 1; font-family: inherit; font-weight: bold; font-size: 15px; letter-spacing: 1px;
            color: #001122; background: #00f0ff; border: 1px solid #00f0ff; padding: 14px 10px;
            cursor: pointer; border-radius: 0; -webkit-appearance: none; appearance: none;
        }
        .btn.secondary { color: #00f0ff; background: rgba(0, 240, 255, 0.08); }
        .btn:disabled { opacity: 0.45; cursor: default; }
        .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        #status { margin-top: 14px; font-size: 13px; min-height: 18px; text-align: center; color: #8ff8ff; }
        .hint { margin-top: 8px; font-size: 11px; color: rgba(143, 248, 255, 0.65); text-align: center; max-width: 720px; line-height: 1.6; }
        /* Logo BINUS Medan di pojok kanan bawah */
        body.has-logo { padding-bottom: calc(max(24px, env(safe-area-inset-bottom)) + 90px); }  /* ruang agar logo tidak menutupi hint */
        .brand-logo {
            position: fixed; z-index: 10; pointer-events: none;
            right: max(14px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom));
            height: 72px; width: auto; max-width: 45vw; object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.6));
        }
        .brand-logo:not([src]) { display: none; }
        @media (min-width: 768px) { .brand-logo { height: 96px; } }
    </style>
</head>
<body>
    <!-- <h1>BIO_SYNC // ARCHITECT_OS CAPTURE</h1> -->

    <div class="frame"><img id="photo" alt="Foto Voxel Architect kamu"></div>

    <div class="actions">
        <button id="save_btn" class="btn" type="button" disabled>SAVE PHOTO</button>
        <button id="share_btn" class="btn secondary" type="button" disabled>SHARE</button>
    </div>
    <div id="status" role="status" aria-live="polite">Memuat foto...</div>
    <div class="hint" id="hint">iPhone: tekan SAVE PHOTO lalu pilih "Save Image", atau tekan lama foto lalu "Save to Photos".</div>

    <!-- Logo "BINUS @Medan Mantap Kaleee" digambar oleh binus-logo.js (sama dengan watermark foto & video) -->
    <img class="brand-logo" id="brand_logo" alt="BINUS @Medan Mantap Kaleee"
         onload="document.body.classList.add('has-logo')" onerror="this.remove()">

    <script src="config.js"></script>
    <script src="binus-logo.js"></script>
    <script>
        if (window.BinusLogo) window.BinusLogo.ready.then(() => {
            document.getElementById('brand_logo').src = window.BinusLogo.canvas.toDataURL('image/png');
        });
    </script>
    <script>
        const APP = Object.assign({ SUPABASE_URL: '', BUCKET: 'fog-glass', FOLDER: 'photos' }, window.BIO_SYNC_CONFIG || {});
        const photoEl = document.getElementById('photo');
        const saveBtn = document.getElementById('save_btn');
        const shareBtn = document.getElementById('share_btn');
        const statusEl = document.getElementById('status');

        const isTouch = window.matchMedia('(pointer: coarse)').matches;
        let file = null, objectUrl = null, fileName = 'bio-sync.jpg';

        // Hanya terima path foto milik app ini (bukan URL bebas)
        const path = new URLSearchParams(location.search).get('p') || '';
        const folderRe = APP.FOLDER.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const validPath = new RegExp(`^${folderRe}/\\d{4}-\\d{2}-\\d{2}/[A-Za-z0-9-]+\\.jpg$`).test(path);

        function setStatus(t) { statusEl.textContent = t; }

        async function load() {
            if (!APP.SUPABASE_URL || !validPath) { setStatus('Link foto tidak valid.'); return; }

            // Foto diambil dari Supabase Storage (bucket publik)
            const publicUrl = `${APP.SUPABASE_URL.replace(/\/$/, '')}/storage/v1/object/public/${encodeURIComponent(APP.BUCKET)}/${path.split('/').map(encodeURIComponent).join('/')}`;
            fileName = `bio-sync-${path.split('/')[1]}-${path.split('/').pop().slice(0, 8)}.jpg`;

            try {
                // Blob diambil di awal: navigator.share() di iOS harus dipanggil langsung dari tap, tanpa await fetch
                const res = await fetch(publicUrl);
                if (!res.ok) throw new Error(res.status === 404 || res.status === 400 ? 'Foto tidak ditemukan atau sudah dihapus.' : `HTTP ${res.status}`);
                const blob = await res.blob();
                file = new File([blob], fileName, { type: 'image/jpeg' });
                objectUrl = URL.createObjectURL(blob);
                photoEl.src = objectUrl;
                saveBtn.disabled = false;
                shareBtn.disabled = false;
                setStatus('');
            } catch (err) {
                console.error(err);
                photoEl.src = publicUrl;   // fallback: tetap bisa long-press untuk simpan
                photoEl.onerror = () => setStatus('Foto tidak ditemukan atau sudah dihapus.');
                setStatus(err.message || 'Gagal memuat foto.');
            }
        }

        const canShareFile = () => !!(file && navigator.canShare && navigator.canShare({ files: [file] }));

        function downloadFile() {
            const a = document.createElement('a');
            a.href = objectUrl; a.download = fileName;
            document.body.appendChild(a); a.click(); a.remove();
            setStatus('Foto tersimpan ke folder Downloads.');
        }

        async function shareFile(opts) {
            try { await navigator.share(opts); return true; }
            catch (err) {
                if (err.name === 'AbortError') return true;   // user batal
                console.error(err);
                return false;
            }
        }

        // SAVE: di HP lewat share sheet (cara web menyimpan ke Photos/Galeri di iOS), di desktop download biasa
        saveBtn.addEventListener('click', async () => {
            if (isTouch && canShareFile() && await shareFile({ files: [file] })) return;
            downloadFile();
        });

        // SHARE: file foto -> link -> salin link
        shareBtn.addEventListener('click', async () => {
            if (canShareFile() && await shareFile({ files: [file], title: 'Voxel Architect' })) return;
            if (navigator.share && await shareFile({ title: 'Voxel Architect', url: location.href })) return;
            try {
                await navigator.clipboard.writeText(location.href);
                setStatus('Link disalin ke clipboard.');
            } catch {
                setStatus('Tidak bisa share di browser ini. Salin link dari address bar.');
            }
        });

        if (!isTouch) document.getElementById('hint').textContent = 'Klik SAVE PHOTO untuk download, atau SHARE untuk membagikan.';
        load();
    </script>
</body>
</html>
